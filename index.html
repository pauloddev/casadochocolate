<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casa do Chocolate Confeitaria</title>
<meta name="description" content="Casa do Chocolate Confeitaria - bolos decorados feitos com carinho pra todos os eventos.">
<meta name="theme-color" content="#fde0de">
<meta property="og:title" content="Casa do Chocolate Confeitaria">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:site_name" content="Casa do Chocolate Confeitaria">
<meta property="og:url" content="https://casadochocolate.vercel.app/">
<meta property="og:image" content="https://casadochocolate.vercel.app/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://casadochocolate.vercel.app/img/og.jpg">
<link rel="icon" href="img/chef.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fde0de;--cream:#f7eee8;
  --cream-2:#efe0d6;
  --copper:#c1672d;
  --copper-light:#e8a066;
  --copper-dark:#9c4a1c;
  --brown:#4a2a22;
  --ink:#3a3a3a;
  --grad:linear-gradient(135deg,#662d11 0%,#854527 32%,#a8644a 52%,#78391b 76%,#5e2a10 100%);
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Montserrat","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans);color:var(--brown);min-height:100vh;
  background:var(--bg);
  overflow-x:hidden;
}
/* textura marmorizada suave */
.wrap{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 20px max(40px,env(safe-area-inset-bottom))}

/* LOGO */
.logo{display:block;width:min(64vw,260px);box-shadow:none;aspect-ratio:1/1;margin:0 auto;border-radius:50%;overflow:hidden;
  box-shadow:0 14px 40px rgba(156,74,28,.25),0 0 0 1px rgba(193,103,45,.25);
  animation:pop .9s cubic-bezier(.2,.8,.2,1) both}
.logo img{width:100%;height:100%;display:block;object-fit:cover}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.92)}to{opacity:1;transform:none}}

.ceo{text-align:center;margin-top:14px;line-height:1.3;animation:pop 1s .05s both}
.ceo b{display:block;font-family:var(--serif);font-size:24px;font-weight:600;color:var(--brown)}
.ceo span{font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;font-weight:600;color:var(--copper-dark)}
.brand{display:block;width:min(76vw,320px);height:auto;margin:14px auto 0;animation:pop 1s .08s both}
.slogan{text-align:center;margin:12px auto 0;max-width:340px;font-family:var(--serif);font-style:italic;font-weight:600;
  font-size:clamp(21px,5.6vw,26px);line-height:1.25;color:var(--brown);animation:pop 1s .1s both}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px auto 0;color:var(--copper)}
.orn i{height:1px;width:64px;background:linear-gradient(90deg,transparent,var(--copper))}
.orn i:last-child{transform:scaleX(-1)}
.orn svg{width:14px;height:14px}

/* CARROSSEL */
.carousel{position:relative;margin:22px -20px 0;height:var(--ch,400px);overflow:hidden;touch-action:pan-y;user-select:none}
.slide{position:absolute;top:50%;left:50%;width:var(--sw,240px);aspect-ratio:4/5;border-radius:20px;overflow:hidden;cursor:pointer;
  transition:transform .6s cubic-bezier(.3,.8,.25,1),opacity .6s,filter .6s,box-shadow .6s;
  will-change:transform;background:var(--cream-2);box-shadow:0 4px 12px rgba(74,42,34,.10);border-radius:22px;isolation:isolate}
.slide img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none;border-radius:22px;clip-path:inset(0 round 22px)}
.slide.active{box-shadow:0 10px 24px rgba(156,74,28,.16),0 0 0 2px rgba(232,160,102,.55)}
.slide:not(.active){filter:saturate(.8) brightness(.93)}
.nav{position:absolute;top:50%;z-index:30;width:40px;height:40px;margin-top:-20px;border-radius:50%;border:0;cursor:pointer;
  background:var(--grad);color:#fff;display:grid;place-items:center;
  box-shadow:0 6px 16px rgba(74,42,34,.22);transition:transform .2s,background .2s,color .2s}
.nav:hover{filter:brightness(1.15);transform:scale(1.1)}
.nav:active{transform:scale(.94)}
.nav svg{width:18px;height:18px}
.nav.prev{left:14px}.nav.next{right:14px}
.dots{display:flex;justify-content:center;gap:8px;margin-top:14px}
.dots button{width:8px;height:8px;border-radius:50%;border:0;background:rgba(193,103,45,.3);cursor:pointer;padding:0;transition:all .3s}
.dots button.on{width:24px;border-radius:8px;background:var(--grad)}

/* EVENTOS */
.label{text-align:center;margin:30px 0 14px;font-size:11px;letter-spacing:.32em;text-transform:uppercase;font-weight:600;color:var(--copper-dark)}
.events{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.events li{list-style:none;display:flex;align-items:center;justify-content:center;gap:9px;height:52px;border-radius:14px;
  background:var(--grad);border:0;box-shadow:0 6px 16px rgba(102,45,17,.22);
  font-family:var(--sans);font-weight:600;font-size:14.5px;letter-spacing:.01em;color:#fff;
  transition:transform .25s,box-shadow .25s,background .25s,color .25s}
.events li:last-child{grid-column:1/-1}
.events li svg{width:17px;height:17px;color:#fff;flex:none;transition:color .25s}
.events li:hover{transform:translateY(-3px);filter:brightness(1.12);box-shadow:0 12px 22px rgba(102,45,17,.3)}

/* LOCALIZAÇÃO */
.loc{margin-top:26px;border-radius:20px;padding:20px 18px 18px;text-align:center;background:rgba(255,255,255,.7);
  border:1px solid rgba(193,103,45,.35);box-shadow:0 10px 28px rgba(156,74,28,.12);backdrop-filter:blur(6px)}
.loc .pin{width:42px;height:42px;margin:0 auto 10px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;
  box-shadow:0 8px 18px rgba(156,74,28,.35);animation:bob 2.6s ease-in-out infinite}
.loc .pin svg{width:21px;height:21px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.loc h2{font-family:var(--serif);font-size:24px;font-weight:600}
.loc p{margin-top:6px;font-size:13.5px;line-height:1.55;color:#5b3d34}
.loc p b{font-weight:600;color:var(--brown)}

/* BOTÕES */
.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:16px;
  text-decoration:none;font-weight:600;font-size:14px;letter-spacing:.04em;color:#fff;background:var(--grad);
  box-shadow:0 10px 24px rgba(102,45,17,.3);transition:transform .25s,box-shadow .25s}
.btn svg{width:22px;height:22px;flex:none}
.btn::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-18deg);transition:left .7s}
.btn:hover{transform:translateY(-3px);box-shadow:0 16px 30px rgba(102,45,17,.4)}
.btn:hover::after{left:130%}
.btn:active{transform:translateY(0) scale(.98)}

.loc .btn{margin-top:14px}
.socials{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}

footer{margin-top:30px;text-align:center;font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:rgba(74,42,34,.55)}

.reveal{opacity:0;transform:translateY(18px);transition:opacity .8s,transform .8s}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>
<main class="wrap">

  <a class="logo" href="https://www.instagram.com/casa.do.chocolate/" target="_blank" rel="noopener" aria-label="Casa do Chocolate Confeitaria">
    <img src="img/chef.jpg" alt="Confeiteira da Casa do Chocolate" width="800" height="800">
  </a>

  <div class="ceo"><b>Andréia Oliveira</b><span>CEO</span></div>
  <img class="brand" src="img/logo-casa.png" alt="Casa do Chocolate Confeitaria" width="900" height="698">

  <h1 class="slogan">Bolos decorados feitos com carinho pra todos os eventos</h1>
  <div class="orn" aria-hidden="true"><i></i><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"/></svg><i></i></div>

  <section class="carousel" id="carousel" aria-label="Fotos dos bolos">
    <button class="nav prev" aria-label="Foto anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="nav next" aria-label="Próxima foto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </section>
  <div class="dots" id="dots"></div>

  <div class="label reveal">Fazemos bolos para</div>
  <ul class="events reveal">
    <li><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.5-9.3C1.2 8.4 3 5 6.2 5c2 0 3.2 1.1 3.8 2.2h0C10.600 6.100 11.800 5 13.800 5 17 5 18.800 8.400 17.500 11.700 15.500 16.400 12 21 12 21z" transform="translate(1.5 0)"/></svg>Mesversários</li>
    <li><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c.9 1.600.9 2.800 0 3.800-.9-1-.9-2.200 0-3.800zM11 7h2v3h5a2 2 0 012 2v2.500c-1 .8-2 .8-3 0-1 .8-2 .8-3 0-1 .8-2 .8-3 0-1 .8-2 .8-3 0-1 .8-2 .8-3 0V12a2 2 0 012-2h5zM4 17c1 .8 2 .8 3 0 1 .8 2 .8 3 0 1 .8 2 .8 3 0 1 .8 2 .8 3 0 1 .8 2 .8 3 0V20a1 1 0 01-1 1H5a1 1 0 01-1-1z"/></svg>Aniversários</li>
    <li><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3L1 9l11 6 9-4.900V17h2V9L12 3zM5 13.200V17c0 1.700 3.100 3 7 3s7-1.300 7-3v-3.800l-7 3.800-7-3.800z"/></svg>Formaturas</li>
    <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="14" r="5.500"/><circle cx="15.500" cy="14" r="5.500"/><path d="M7 4l2 3 2-3M13.500 4l2 3 2-3" stroke-linejoin="round"/></svg>Casamentos</li>
    <li><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.500c-3.500 4.500-6 7.500-6 11a6 6 0 0012 0c0-3.500-2.500-6.500-6-11zm0 15.500a3.500 3.500 0 01-3.500-3.500h1.500A2 2 0 0012 16.500V18z"/></svg>Batizados</li>
  </ul>

  <section class="loc reveal">
    <div class="pin"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 00-7 7c0 5.300 7 13 7 13s7-7.700 7-13a7 7 0 00-7-7zm0 9.500A2.500 2.500 0 1112 6.500a2.500 2.500 0 010 5z"/></svg></div>
    <h2>Onde estamos</h2>
    <p><b>Caruaru - PE</b></p>
    <a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=Casa+do+Chocolate+Confeitaria+Caruaru+PE">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>
      Como chegar
    </a>
  </section>

  <div class="socials reveal">
    <a class="btn" target="_blank" rel="noopener" href="https://www.instagram.com/casa.do.chocolate/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.200"/><circle cx="17.300" cy="6.700" r="1" fill="currentColor" stroke="none"/></svg>
      Instagram
    </a>
    <a class="btn ghost" target="_blank" rel="noopener" href="https://wa.me/5581982196059?text=Ol%C3%A1%21%20Vim%20pelo%20link%20do%20Instagram%20e%20gostaria%20de%20um%20or%C3%A7amento%20de%20bolo.">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 00-8.600 15.100L2 22l5-1.300A10 10 0 1012 2zm0 18.200a8.200 8.200 0 01-4.200-1.200l-.3-.2-3 .8.8-2.900-.2-.3A8.200 8.200 0 1112 20.200zm4.500-6.100c-.2-.1-1.500-.7-1.700-.8-.2-.1-.4-.1-.6.100l-.8 1c-.1.200-.3.200-.5.100a6.700 6.700 0 01-3.300-2.900c-.2-.4.200-.4.700-1.300.1-.1 0-.3 0-.4l-.8-1.800c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 00-.7.300 3 3 0 00-.9 2.200c0 1.300.9 2.600 1 2.800.1.200 1.800 2.800 4.400 3.900 1.600.7 2.300.7 3.100.6.500-.1 1.500-.6 1.700-1.200.2-.6.200-1.100.1-1.200l-.5-.3z"/></svg>
      WhatsApp
    </a>
  </div>

  <footer>Casa do Chocolate · Confeitaria</footer>
</main>

<script>
(function(){
  var N=7, imgs=[];
  for(var i=1;i<=N;i++) imgs.push('img/bolo'+(i<10?'0':'')+i+'.jpg');
  var car=document.getElementById('carousel'), dotsEl=document.getElementById('dots'), slides=[], dots=[], cur=0, timer=null, sw=240;

  imgs.forEach(function(src,i){
    var s=document.createElement('div'); s.className='slide'; s.setAttribute('role','group');
    var im=document.createElement('img'); im.src=src; im.alt='Bolo decorado '+(i+1); im.draggable=false;
    if(i>2) im.loading='lazy';
    s.appendChild(im); car.appendChild(s); slides.push(s);
    s.addEventListener('click',function(){ if(!dragged) go(i); });
    var d=document.createElement('button'); d.setAttribute('aria-label','Foto '+(i+1));
    d.addEventListener('click',function(){go(i)}); dotsEl.appendChild(d); dots.push(d);
  });

  function layout(){
    var cw=car.clientWidth;
    sw=Math.min(cw*.56,270);
    car.style.setProperty('--sw',sw+'px');
    car.style.setProperty('--ch',(sw*1.25+44)+'px');
    render();
  }
  function render(){
    var step=sw*.78;
    slides.forEach(function(s,i){
      var o=i-cur; if(o>N/2)o-=N; if(o<-N/2)o+=N;
      var a=Math.abs(o), sc=a===0?1:a===1?.76:.58, x=o*step;
      s.style.transform='translate(-50%,-50%) translateX('+x+'px) scale('+sc+')';
      s.style.zIndex=10-a; s.style.opacity=a>2?0:(a===2?.45:1);
      s.style.pointerEvents=a>2?'none':'auto';
      s.classList.toggle('active',a===0);
      dots[i].classList.toggle('on',a===0);
    });
  }
  function go(i){cur=(i+N)%N;render();restart();}
  function next(){go(cur+1)} function prev(){go(cur-1)}
  function restart(){clearInterval(timer); if(!matchMedia('(prefers-reduced-motion:reduce)').matches) timer=setInterval(next,3600);}

  car.querySelector('.next').addEventListener('click',next);
  car.querySelector('.prev').addEventListener('click',prev);

  // swipe / arrastar
  var sx=0,down=false,dragged=false;
  car.addEventListener('pointerdown',function(e){ if(e.target.closest('.nav'))return; down=true;dragged=false;sx=e.clientX; clearInterval(timer);});
  car.addEventListener('pointermove',function(e){ if(down && Math.abs(e.clientX-sx)>10) dragged=true; });
  function end(e){ if(!down)return; down=false; var dx=e.clientX-sx; if(Math.abs(dx)>40){ dx<0?next():prev(); } else restart(); setTimeout(function(){dragged=false},50);}
  car.addEventListener('pointerup',end); car.addEventListener('pointercancel',function(){down=false;restart();});
  car.addEventListener('mouseenter',function(){clearInterval(timer)}); car.addEventListener('mouseleave',restart);
  document.addEventListener('keydown',function(e){ if(e.key==='ArrowRight')next(); if(e.key==='ArrowLeft')prev(); });
  window.addEventListener('resize',layout);

  layout(); restart();

  // reveal on scroll
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}})},{threshold:.15});
  document.querySelectorAll('.reveal').forEach(function(el){io.observe(el)});
})();
</script>
</body>
</html>
